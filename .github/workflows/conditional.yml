name: Conditional
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - development
          - staging
          - production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.inputs.environment == 'production'
        run: echo "Deploying to production!"
      - if: github.event.inputs.environment != 'production'
        run: echo "Running in test mode"
      - run: echo "Gekozen omgeving is ${{ github.event.inputs.environment }}"
